<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#f7f8f5"/><title>我的一盤蛋白質計算機</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;color:#243028;background:#f7f8f5;font-size:16px}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:26px 17px 80px}h1{font-size:clamp(25px,5vw,34px);letter-spacing:-.05em;margin:7px 0}p{line-height:1.6}.muted{color:#66746b;font-size:13px}.eyebrow{font-size:12px;letter-spacing:.17em;font-weight:800;color:#54795d}.panel{background:white;border:1px solid #e5eae4;border-radius:18px;padding:17px;margin:17px 0;box-shadow:0 3px 12px #26372907}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:17px 0}.stat{background:#e9f3e9;border-radius:18px;padding:17px}.stat:nth-child(2){background:#ecf0f5}.stat .number{font-size:clamp(26px,6vw,40px);font-weight:800;letter-spacing:-.05em;margin:6px 0}.stat .unit{font-size:15px;font-weight:500}.label{font-size:13px;color:#56685e;font-weight:700}.headrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.count{display:flex;align-items:center;gap:9px}.smallbtn,button{border:1px solid #d5dfd5;background:white;border-radius:10px;padding:9px 13px;color:#263d2c;font-weight:700;cursor:pointer;font-size:14px}.smallbtn:hover,button:hover{background:#edf5ed}button:focus-visible,input:focus-visible{outline:3px solid #73a87e;outline-offset:2px}.primary{background:#2e6340;color:white;border-color:#2e6340}.primary:hover{background:#275537}.counter{min-width:28px;text-align:center;font-weight:800;font-size:19px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chips button{padding:7px 11px;font-size:13px;border-radius:999px}.item{padding:16px 0;border-top:1px solid #e9eee9}.item:first-child{border-top:0}.itemtop{display:flex;align-items:center;gap:10px}.itemtop label{font-weight:800;flex:1;cursor:pointer}.itemtop input[type=checkbox]{accent-color:#2e7247;width:22px;height:22px}.itemmeta{font-size:12px;color:#67776d;margin-top:3px}.control{padding-left:32px;margin-top:13px}.rangehead{display:flex;justify-content:space-between;gap:10px;align-items:center}.weight{display:flex;align-items:center;gap:5px}.weight input{width:74px;padding:7px;border:1px solid #ccd8cc;border-radius:9px;font-size:16px;text-align:right}.weight span{font-size:13px;color:#526456}input[type=range]{width:100%;accent-color:#417d54;cursor:pointer;margin:12px 0 3px}.itemfoot{display:flex;justify-content:space-between;font-size:13px;color:#54665a}.protein{font-weight:800;color:#24643b}.disabled{opacity:.4}.sectiontitle{font-size:19px;margin:0 0 9px}.row-form{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:12px 0}.row-form input{width:100%;border:1px solid #cdd8cd;border-radius:10px;padding:11px;font-size:15px;min-width:0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.hint{font-size:12px;line-height:1.6;color:#687970}.remove{font-size:12px;padding:5px 8px}.empty{color:#79877b;text-align:center;padding:16px}footer{margin-top:20px}.summary{border-top:1px solid #e4eae4;margin-top:12px;padding-top:11px}.summaryline{display:flex;justify-content:space-between;margin:8px 0;gap:9px;font-size:14px}@media(max-width:450px){.row-form{grid-template-columns:1fr 1fr}.row-form input:first-child{grid-column:1/-1}.stats{gap:8px}.stat{padding:13px}.control{padding-left:0}}
</style></head><body><main>
<div class="eyebrow">MY MEAL · 蛋白質追蹤</div><h1>🥗 我的蛋白質計算機</h1><p class="muted">勾選這餐的食材、滑動重量，整盤和每人份量就會自動更新。數值可自行修改。</p>
<div class="stats" aria-live="polite"><div class="stat"><div class="label">整盤蛋白質</div><div class="number"><span id="total">0.0</span><span class="unit"> g</span></div><div class="muted">這餐所有勾選食材</div></div><div class="stat"><div class="label">每人平均</div><div class="number"><span id="per">0.0</span><span class="unit"> g</span></div><div class="muted">平均分配計算</div></div></div>
<div class="panel"><div class="headrow"><div><strong>🍽️ 用餐人數</strong><div class="muted">預設兩人平分</div></div><div class="count"><button type="button" id="minus" aria-label="減少用餐人數">−</button><span class="counter" id="people">2</span><button type="button" id="plus" aria-label="增加用餐人數">＋</button></div></div></div>
<div class="panel"><div class="headrow"><h2 class="sectiontitle">選擇食材</h2><button type="button" id="clear">全部取消</button></div><div class="chips" id="presets"><button type="button" data-preset="shrimp">🦐 蝦仁豆腐</button><button type="button" data-preset="fish">🐟 鱸魚豆腐蛋</button><button type="button" data-preset="none">清空重選</button></div><div id="items"></div></div>
<div class="panel"><h2 class="sectiontitle">＋ 自訂食材</h2><p class="muted">找不到食材？輸入名稱、每 100 g 蛋白質和這餐食用重量。</p><form id="addform"><div class="row-form"><input required id="newname" placeholder="食材名稱（例：雞胸肉）" maxlength="28" aria-label="食材名稱"/><input required id="newprotein" type="number" min="0" max="100" step="0.1" placeholder="蛋白/100g" aria-label="每百公克蛋白質"/><input required id="newgrams" type="number" min="1" max="3000" step="1" placeholder="重量 g" aria-label="食用重量公克"/></div><button type="submit" class="primary">新增並勾選</button></form></div>
<div class="panel"><h2 class="sectiontitle">本餐明細</h2><div id="details" class="muted">尚未選擇食材</div><div class="actions"><button type="button" id="copy" class="primary">複製本餐結果</button><button type="button" id="reset">恢復預設資料</button></div></div>
<footer class="hint">資料說明：蛋白質數值皆為估算，實際以各產品營養標示為準。重量以可食部分計（魚片、去殼蝦仁等），雞蛋用「顆」、毛豆仁用「顆」計算。豆腐每盒重量和產品品項可能不同，請依包裝調整。輸入設定只儲存在目前瀏覽器，不會上傳。</footer>
</main><script>
const defaults=[
{id:'soft',name:'義美嫩豆腐',p:5,grams:300,max:600,step:10,unit:'g',note:'估算每盒 300 g，約 15 g 蛋白質'},
{id:'firm',name:'義美板豆腐',p:9.8,grams:300,max:600,step:10,unit:'g',note:'每 100 g 約 9.8 g'},
{id:'dried',name:'義美五香豆干',p:10.2,grams:100,max:400,step:10,unit:'g',note:'調味豆干估值；白豆干可自行調整'},
{id:'shrimp',name:'去頭去殼蝦仁',p:20,grams:100,max:400,step:10,unit:'g',note:'以去殼可食重量計'},
{id:'bass',name:'去骨鱸魚片',p:20,grams:420,max:600,step:10,unit:'g',note:'以魚片可食重量計'},
{id:'salmon',name:'鮭魚',p:21,grams:180,max:500,step:10,unit:'g',note:'以魚肉可食重量計'},
{id:'milkfish',name:'虱目魚肚',p:18.8,grams:170,max:500,step:10,unit:'g',note:'含腹部脂肪；以可食重量計'},
{id:'egg',name:'雞蛋',p:6.5,grams:2,max:12,step:1,unit:'顆',note:'每顆約 6.5 g 蛋白質'},
{id:'edamame',name:'毛豆仁',p:0.075,grams:10,max:100,step:1,unit:'顆',note:'10 顆約 0.75 g；按顆估算'},
{id:'chicken',name:'雞胸肉（生）',p:23,grams:100,max:500,step:10,unit:'g',note:'每 100 g 約 23 g'}];
let items=defaults.map(x=>({...x,selected:false})),people=2;
try{const saved=JSON.parse(localStorage.getItem('proteinMealV1'));if(saved&&Array.isArray(saved.items)){items=saved.items;people=Math.min(20,Math.max(1,Number(saved.people)||2))}}catch(e){}
const $=s=>document.querySelector(s),escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem('proteinMealV1',JSON.stringify({items,people}))}catch(e){}}
function nutrient(x){return x.p*x.grams/(x.unit==='g'?100:1)}
function draw(){
$('#people').textContent=people;
$('#items').innerHTML=items.map((x,i)=>`<div class="item ${x.selected?'':'disabled'}"><div class="itemtop"><input type="checkbox" id="check${i}" data-index="${i}" class="select" ${x.selected?'checked':''}/><label for="check${i}">${escapeHtml(x.name)}</label>${x.custom?`<button type="button" data-index="${i}" class="remove">刪除</button>`:''}</div><div class="control"><div class="rangehead"><div class="itemmeta">${escapeHtml(x.note||'')}${x.unit==='g'?` · 每100g ${x.p}g 蛋白質`:''}</div><div class="weight"><input type="number" class="grams" data-index="${i}" min="0" max="3000" step="${x.step||1}" value="${x.grams}" aria-label="${escapeHtml(x.name)}數量"/><span>${x.unit}</span></div></div><input type="range" class="range" data-index="${i}" min="0" max="${Math.max(x.max,x.grams)}" step="${x.step||1}" value="${x.grams}" aria-label="調整${escapeHtml(x.name)}重量"/><div class="itemfoot"><span>${x.unit==='g'?`${x.grams} g × ${x.p} g/100 g`:`${x.grams} 顆 × ${x.p} g`}</span><span class="protein">${x.selected?nutrient(x).toFixed(1):'0.0'} g</span></div></div></div>`).join('');
const chosen=items.filter(x=>x.selected),total=chosen.reduce((s,x)=>s+nutrient(x),0);
$('#total').textContent=total.toFixed(1);$('#per').textContent=(total/people).toFixed(1);
$('#details').innerHTML=chosen.length?chosen.map(x=>`<div class="summaryline"><span>${escapeHtml(x.name)} · ${x.grams} ${x.unit}</span><strong>${nutrient(x).toFixed(1)} g</strong></div>`).join('')+`<div class="summary summaryline"><strong>整盤 ${total.toFixed(1)} g</strong><strong>${people} 人均分 ${ (total/people).toFixed(1)} g/人</strong></div>`:'尚未選擇食材';save();
}
$('#items').addEventListener('input',e=>{const t=e.target,idx=Number(t.dataset.index);if(!Number.isInteger(idx)||!items[idx])return;if(t.classList.contains('grams')||t.classList.contains('range')){const n=Number(t.value);if(Number.isFinite(n)){items[idx].grams=Math.max(0,Math.min(3000,n));draw()}}});
$('#items').addEventListener('change',e=>{if(e.target.classList.contains('select')){items[Number(e.target.dataset.index)].selected=e.target.checked;draw()}});
$('#items').addEventListener('click',e=>{if(e.target.classList.contains('remove')){items.splice(Number(e.target.dataset.index),1);draw()}});
$('#minus').onclick=()=>{people=Math.max(1,people-1);draw()};$('#plus').onclick=()=>{people=Math.min(20,people+1);draw()};
$('#clear').onclick=()=>{items.forEach(x=>x.selected=false);draw()};
$('#presets').onclick=e=>{const p=e.target.closest('[data-preset]')?.dataset.preset;if(!p)return;const selected=p==='shrimp'?['soft','shrimp','edamame']:p==='fish'?['soft','bass','egg']:[];items.forEach(x=>{x.selected=selected.includes(x.id);if(x.id==='egg'&&p==='fish')x.grams=2});people=2;draw()};
$('#addform').onsubmit=e=>{e.preventDefault();const name=$('#newname').value.trim(),p=Number($('#newprotein').value),grams=Number($('#newgrams').value);if(!name||!Number.isFinite(p)||p<0||p>100||!Number.isFinite(grams)||grams<=0)return;items.push({id:'custom'+Date.now(),name,p,grams,max:Math.max(500,grams),step:1,unit:'g',note:'自訂營養數值',custom:true,selected:true});$('#addform').reset();draw()};
$('#reset').onclick=()=>{if(confirm('要恢復所有預設食材及數量嗎？自訂食材也會清除。')){items=defaults.map(x=>({...x,selected:false}));people=2;draw()}};
$('#copy').onclick=async()=>{const chosen=items.filter(x=>x.selected);let total=chosen.reduce((s,x)=>s+nutrient(x),0);const msg=`我的一餐蛋白質\n${chosen.map(x=>`${x.name} ${x.grams}${x.unit}：${nutrient(x).toFixed(1)} g`).join('\n')}\n整盤：${total.toFixed(1)} g\n${people} 人平分：每人 ${(total/people).toFixed(1)} g`;try{await navigator.clipboard.writeText(msg);$('#copy').textContent='已複製 ✓';setTimeout(()=>$('#copy').textContent='複製本餐結果',1800)}catch(e){window.prompt('複製以下內容',msg)}};
draw();
</script></body></html>
